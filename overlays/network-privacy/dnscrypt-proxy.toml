# WraithLink dnscrypt-proxy configuration (optional "super encrypted" DNS).
# Installed to /system/etc/wraithlink/dnscrypt-proxy.toml and run as a system
# service listening on 127.0.0.1:5353; the Private DNS resolver points at it.
# Only used when WL_BUNDLE_DNSCRYPT=true.

listen_addresses = ['127.0.0.1:5353']
max_clients = 250

# Require encrypted, no-log, DNSSEC-validating resolvers.
require_dnssec = true
require_nolog = true
require_nofilter = true

# Prefer DoH + DNSCrypt; enable anonymized relays for extra metadata protection.
doh_servers = true
dnscrypt_servers = true

# Anonymized DNS: route queries through relays so the resolver never sees client IP.
[anonymized_dns]
skip_incompatible = true

[sources]
  [sources.'public-resolvers']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md']
  cache_file = 'public-resolvers.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72

  [sources.'relays']
  urls = ['https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md']
  cache_file = 'relays.md'
  minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
  refresh_delay = 72
