# WraithLink build config — Pixel 8a (akita).
# Use: WL_CONFIG="${HOME}/wraithlink/config/wraithlink-akita.conf" scripts/0x-….sh

# ---- Branding ----
WL_NAME="WraithLink"
WL_VENDOR="WraithLink"
WL_DOMAIN="wraithlink.com"

# ---- Device / source ----
WL_DEVICE="akita"
WL_BRANCH="17"
WL_MANIFEST_URL="https://github.com/GrapheneOS/platform_manifest.git"
WL_SRC_DIR="${HOME}/wraithlink-src"
WL_SYNC_JOBS="8"

# ---- Signing ----
WL_KEYS_DIR="${WL_SRC_DIR}/keys/${WL_DEVICE}"
WL_CERT_CN="WraithLink"

# ---- OTA / Updater ----
WL_OTA_URL="https://ota.${WL_DOMAIN}"

# ---- Network privacy defaults ----
WL_DEFAULT_DNS_HOST="dns.mullvad.net"
WL_MAC_RANDOMIZATION="per-connection"
WL_BUNDLE_DNSCRYPT="false"
WL_APPS_REPO_HOST=""

# ---- X47 remote link ----
WL_X47_TRANSPORT="onion"

# ---- Milestones (v1: off) ----
WL_ENABLE_DECOY_DURESS="false"
WL_ENABLE_MEDIA_PRIVACY="true"

# ---- Build ----
WL_BUILD_VARIANT="user"
WL_OFFICIAL_BUILD="true"
# Warm cache OK after tokay; akita product out is separate under out/target/product/akita.
WL_INCREMENTAL="true"
