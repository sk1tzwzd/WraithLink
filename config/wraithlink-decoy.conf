# Milestone 2 — decoy-duress rebuild (tokay).
# Keeps lean v1 config (wraithlink.conf) untouched / decoy=false for published images.
# Use: WL_CONFIG=.../wraithlink-decoy.conf scripts/04-apply-rebrand.sh && scripts/05-build.sh
#
# Do not deploy with 07-deploy-site.sh until docs/decoy-qa.md hardware checklist passes.

WL_NAME="WraithLink"
WL_VENDOR="WraithLink"
WL_DOMAIN="wraithlink.com"

WL_DEVICE="tokay"
WL_BRANCH="17"
WL_MANIFEST_URL="https://github.com/GrapheneOS/platform_manifest.git"
WL_SRC_DIR="${HOME}/wraithlink-src"
WL_SYNC_JOBS="8"

WL_KEYS_DIR="${WL_SRC_DIR}/keys/${WL_DEVICE}"
WL_CERT_CN="WraithLink"
WL_OTA_URL="https://ota.${WL_DOMAIN}"

WL_DEFAULT_DNS_HOST="dns.mullvad.net"
WL_MAC_RANDOMIZATION="per-connection"
WL_BUNDLE_DNSCRYPT="false"
WL_APPS_REPO_HOST=""

WL_X47_TRANSPORT="onion"

# Milestone 2 — enable vault-wipe decoy PIN (keep GrapheneOS panic duress as well).
WL_ENABLE_DECOY_DURESS="true"
WL_ENABLE_MEDIA_PRIVACY="true"

WL_BUILD_VARIANT="user"
WL_OFFICIAL_BUILD="true"
WL_INCREMENTAL="true"
