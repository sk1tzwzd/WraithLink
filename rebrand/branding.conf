# Branding map for the GrapheneOS -> WraithLink rename.
# Consumed by rebrand/rebrand.sh. Keep this conservative: renaming Java/AOSP
# PACKAGE IDS (e.g. org.grapheneos.*) is intentionally NOT done here because it
# breaks Vanadium/WebView provider wiring and signed-app expectations. We rename
# user-visible branding, build props, and the update server URL only.

# Display / user-visible name
OLD_NAME="GrapheneOS"
NEW_NAME="WraithLink"

# Lowercase / slug forms used in some strings and file names
OLD_SLUG="grapheneos"
NEW_SLUG="wraithlink"

# Files whose *string resources* should be renamed (relative to source root).
# Globs are expanded at runtime; only <string> element *bodies* are touched (never
# the name="..." IDs, tags or attributes), and only when they contain "GrapheneOS".
# NOTE: find(1) -path treats '*' as matching '/', so each glob below is recursive.
# We deliberately do NOT touch NOTICE/license/credits blobs (not strings.xml) - the
# upstream attribution to GrapheneOS/AOSP must remain (see NOTICE, docs/licensing.md).
STRING_RES_GLOBS=(
  "frameworks/base/*/res/values*/strings.xml"
  "packages/*/res/values*/strings.xml"
  "device/*/res/values*/strings.xml"
  "external/*/res/values*/strings.xml"
)

# Build properties to set (handled specially in rebrand.sh, not via sed).
#   ro.product.* model/brand, bootloader/version banners, etc.

# Assets to replace (source PNG/boot-animation in rebrand/assets/ -> tree paths).
# Format: "SOURCE_IN_REBRAND_ASSETS::DEST_IN_SOURCE_TREE"
ASSET_REPLACEMENTS=(
  "bootanimation.zip::frameworks/base/data/bootanimation/bootanimation.zip"
  "wraithlink_logo.png::frameworks/base/core/res/res/drawable-xxhdpi/platlogo.png"
)

# The Updater config that MUST be repointed to your own OTA server.
UPDATER_CONFIG="packages/apps/Updater/res/values/config.xml"
